<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exciting Expeditions | Contact Us</title>
    <meta name="description"
      content="White Water Rafting Site - This is the Contact Us page where a user can input their information so that the company can reach out to them.">
    <meta name="author" content="Julie Jones">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/exciting-expeditions-logo.png"
          alt="White River Rafting Logo - Exciting Expeditions">

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="company-info">
            <h1>Exciting Expeditions Rafting</h1>
            <p>123 River Road</p>
            <p>Mesa, Arizona</p>
            <p>+1 123 456 7890</p>
            <p>info@excitingexpeditions.com</p>
        </div>
        <div class="contact">
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d26595.02203910023!2d-111.47733113472752!3d33.56953994284537!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sus!4v1780007873753!5m2!1sen!2sus"
                  width="600" height="450" allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
            <div class="contact-form">
                <form>
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="ex: Leroy Jenkins">

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email"
                      placeholder="ex: ljenkins@gmail.com">
                    <div class="purpose-label">
                        <label for="purpose">Purpose of<br>Message</label>
                    </div>
                    <div class="radio-button">
                        <label>
                            <input type="radio" id="purpose" name="purpose" value="general">General
                            Inquiry
                        </label>
                        <label for="reservation">
                            <input type="radio" id="reservation" name="purpose"
                              value="reservation">Reservation Question
                        </label>
                        <label for="website">
                            <input type="radio" id="website" name="purpose" value="website">Website
                            Suggestion
                        </label>
                    </div>
                    <div class="message-box">
                        <label for="message">Message</label>
                        <textarea id="message" name="message"
                          placeholder="Type your message here"></textarea>

                    </div>

                    <div class="newsletter">
                        <input type="checkbox" id="subscribe" name="subscribe">
                        <label for="subscribe">Subscribe me to the monthly newsletter</label>
                    </div>


                    <button type="submit">Get in Touch!</button>
                </form>
            </div>
        </div>

        <div class="employees">
            <section>
                <h2>We Are Here to Serve You</h2>
                <div class="employee-images">
                    <figure>
                        <img src="images/sales-reservationist.jpg"
                          alt="Company's sales and reservationist.">
                        <figcaption>Sales and Reservationist</figcaption>
                    </figure>
                    <figure>
                        <img src="images/raft-guide.jpg" alt="Company's white water rafting guide">
                        <figcaption>White Water Guide</figcaption>
                    </figure>
                    <figure>
                        <img src="images/outfitter.jpg" alt="Company's lead outfitter.">
                        <figcaption>Lead Outfitter</figcaption>
                    </figure>
                </div>
            </section>
        </div>
    </main>
    <footer>
        <p>©2026 | Exciting Expeditions | Julie Jones</p>
        <nav class="socialmedia">
            <a href="https://facebook.com"><img src="images/facebook.svg" alt="Facebook Icon"
                  width="50"></a>
            <a href="https://linkedin.com"><img src="images/linkedin.svg" alt="LinkedIn Icon"
                  width="50"></a>
            <a href="https://instagram.com"><img src="images/instagram.svg" alt="Instagram Icon"
                  width="55"></a>
        </nav>
    </footer>
</body>

</html>
