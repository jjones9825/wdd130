<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exciting Expeditions - Contact Us</title>
    <meta name="description"
      content="White Water Rafting Site - This is the Contact Us page where a user can input their information so that the company can reach out to them.">
    <meta name="author" content="Julie Jones">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/exciting-expeditions-logo.png"
          alt="White River Rafting Logo - Exciting Expeditions">

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="company-info">
            <h2>Exciting Expeditions White Water Rafting</h2>
            <p>123 River Road</p>
            <p>Moab, Utah</p>
            <p>+1 123 456 7890</p>
            <p>info@excitingexpeditions.com</p>
        </div>
        <div class="map">

        </div>
        <div class="contact-form">
            <form>
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Leroy Jenkins">

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="ljenkins@gmail.com">

                <label for="purpose">Purpose of Message</label>
                <input type="radio" id="general" name="purpose" value="general">
                <label for="general">General Inquiry</label><br>
                <input type="radio" id="reservation" name="purpose" value="reservation">
                <label for="reservation">Reservation Question</label><br>
                <input type="radio" id="website" name="purpose" value="website">
                <label for="website">Website Suggestion</label><br>


                <label for="message">Message</label>
                <textarea id="message" name="message"
                  placeholder="Type your message here"></textarea>

                <label for="subscribe">Please Subscribe me to the monthly newsletter</label>
                <input type="checkbox" id="subscribe" name="subscribe">

                <button type="submit">Get in Touch!</button>
            </form>
        </div>
        <div class="employees">
            <section>
                <h2>We Are Here to Serve You</h2>
                <div class="employee-images">
                    <figure>
                        <img src="images/rafting-adventure-one.jpg"
                          alt="Group rafting down a river from a distance.">
                        <figcaption>Sales and Reservationist</figcaption>
                    </figure>
                    <figure>
                        <img src="images/rafting-adventure-two.jpg"
                          alt="Group rafting down rapids close up.">
                        <figcaption>White Water Guide</figcaption>
                    </figure>
                    <figure>
                        <img src="images/rafting-adventure-three.jpg"
                          alt="Close up of group battling rapids in a raft.">
                        <figcaption>Lead Outfitter</figcaption>
                    </figure>
            </section>
        </div>
    </main>
    <footer>
        <p>©2026 | Exciting Expeditions | Julie Jones</p>
        <nav class="socialmedia">
            <a href="https://facebook.com"><img src="images/facebook.svg" alt="Facebook Icon"
                  width="50"></a>
            <a href="https://linkedin.com"><img src="images/linkedin.svg" alt="LinkedIn Icon"
                  width="50"></a>
            <a href="https://instagram.com"><img src="images/instagram.svg" alt="Instagram Icon"
                  width="55"></a>
        </nav>
    </footer>
</body>

</html>
